<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151f"><title>Mikro Ölçüm Merkezi</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#10151f;color:#eef2f7;font-family:Arial,sans-serif}.container{max-width:650px;margin:auto}h1{font-size:25px}.sub,.small,.status{color:#9ca9bb;font-size:14px}.card{background:#1b2432;border:1px solid #303d50;border-radius:14px;padding:16px;margin:15px 0}.field,.grid input{width:100%;padding:13px;margin:8px 0 15px;border-radius:8px;border:1px solid #45536a;background:#111a27;color:white;font-size:17px}button{border:0;border-radius:10px;padding:14px 16px;font-weight:bold;font-size:15px;background:#287bda;color:white;width:100%;cursor:pointer}#voice{background:#16865d;margin-bottom:10px}.grid{display:grid;grid-template-columns:75px 1fr;gap:9px;align-items:center;margin:8px 0}.grid input{margin:0}.code{font-weight:bold}.success{color:#54d99b}.danger{color:#ff9288}button:disabled{opacity:.5}
</style></head><body><div class="container">
<h1>📐 Mikro Ölçüm Merkezi</h1><p class="sub">Sabit Excel şablonuyla manuel ve sesli ölçüm</p>
<div class="card"><h3>1. Rapor bilgileri</h3><label>Seri numarası</label><input class="field" id="serial" placeholder="Motor seri numarası"><label>Rapor tarihi</label><input class="field" id="date" type="date"></div>
<div class="card"><h3>2. Sesli giriş</h3><button id="voice">🎙️ Dinlemeye başla</button><p class="small">Örnek: K31, 3 virgül 981</p><p id="voiceStatus" class="status">Hazır.</p></div>
<div class="card"><h3>3. Ölçüm değerleri</h3><div id="measurements"></div></div>
<div class="card"><button id="download">⬇ Seri numarasıyla Excel indir</button><p id="status" class="status">Şablon otomatik kullanılır; dosya yüklemen gerekmez.</p></div>
</div>
<script>
const codes=["K31","K34","K41","K43","B","K32","K33","K36","A","C","D","H","K35","K42","K44"];
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);
$("measurements").innerHTML=codes.map(c=>`<div class="grid"><span class="code">${c}</span><input id="v_${c}" inputmode="decimal" placeholder="Ölçüm değeri"></div>`).join("");
function parseSpoken(t){return t.toLocaleLowerCase("tr-TR").replace(/virgül|virgulu/g,".").replace(/,/g,".").replace(/\s+/g,"").replace(/[^\d.-]/g,"");}
function processVoice(t){const u=t.toLocaleUpperCase("tr-TR");const m=u.match(/\b(K31|K34|K41|K43|K32|K33|K36|K35|K42|K44|B|A|C|D|H)\b/);if(!m){$("voiceStatus").textContent="Kod anlaşılamadı.";return;}const rest=t.substring(u.indexOf(m[1])+m[1].length).trim().replace(/^[\s,:-]+/,"");const v=parseSpoken(rest);if(!v && !/^(OK|RET)$/i.test(rest)){$("voiceStatus").textContent="Değer anlaşılamadı.";return;}$("v_"+m[1]).value=/^(OK|RET)$/i.test(rest)?rest.toUpperCase():v;$("voiceStatus").textContent=m[1]+" kaydedildi: "+$("v_"+m[1]).value;}
$("voice").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("voiceStatus").textContent="Ses tanıma bu tarayıcıda desteklenmiyor.";return;}const r=new SR();r.lang="tr-TR";r.onstart=()=>$("voiceStatus").textContent="Dinliyorum...";r.onresult=e=>processVoice(e.results[0][0].transcript);r.onerror=e=>$("voiceStatus").textContent="Ses hatası: "+e.error;r.start();};
$("download").onclick=async()=>{const serial=$("serial").value.trim();if(!serial){$("status").textContent="Önce seri numarası gir.";return;}const measurements=codes.map(code=>({code,value:$("v_"+code).value.trim()})).filter(x=>x.value);$("download").disabled=true;$("status").textContent="Excel hazırlanıyor...";try{const response=await fetch("/api/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({serialNumber:serial,date:$("date").value,measurements})});if(!response.ok)throw new Error(await response.text());const blob=await response.blob();const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;const safe=serial.replace(/[\\/:*?"<>|\\r\\n]/g,"_");a.download=safe+".xls";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$("status").textContent="Rapor indirildi: "+a.download;$("status").className="status success";}catch(e){$("status").textContent="Hata: "+e.message;$("status").className="status danger";}finally{$("download").disabled=false;}};
</script></body></html>
